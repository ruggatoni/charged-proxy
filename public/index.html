<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Charged Proxy</title>
  <meta name="description" content="The Charged Proxy — plug in any URL and browse anything." />
  <meta name="theme-color" content="#06070d" />
  <link rel="icon" type="image/svg+xml" href="/img/bolt.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Inside the Charged Browser desktop app: show its title bar from the first paint.
    if (window.chargedApp) document.documentElement.classList.add("in-app", "plat-" + window.chargedApp.platform);
  </script>
</head>
<body>
  <!-- title bar, only shown in the Charged Browser desktop app -->
  <header class="appbar" aria-hidden="true">
    <svg class="bolt" viewBox="0 0 24 24"><use href="#i-bolt" /></svg>
    <span class="appbar-name">charged browser</span>
    <span class="appbar-title" id="appTitle"></span>
  </header>

  <!-- ambient background -->
  <div class="bg" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="grid"></div>
    <canvas id="sparks"></canvas>
  </div>

  <!-- ============ HOME ============ -->
  <main id="home" class="home">
    <header class="topbar">
      <a class="brand" href="/" aria-label="The Charged Proxy home">
        <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bolt" /></svg>
        <span>charged</span>
      </a>
      <div class="topbar-right">
        <div id="status" class="status charging" role="status" title="Connecting the proxy engine">
          <span class="dot"></span><span class="label">Charging…</span>
        </div>
        <button id="openSettings" class="icon-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><use href="#i-gear" /></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="mascot" id="mascot">
        <div class="halo"></div>
        <img id="goat" src="/img/goat/1_idle.png" alt="Charged Goat mascot" width="160" height="145" draggable="false" />
      </div>

      <p class="kicker">the</p>
      <h1 class="title"><span class="charged">Charged</span> Proxy</h1>
      <p class="tagline">Plug in any URL. Ride the current anywhere.</p>

      <form id="searchForm" class="search" autocomplete="off">
        <svg class="search-bolt" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bolt" /></svg>
        <input id="searchInput" type="text" spellcheck="false" placeholder="Search or enter a URL…" aria-label="Search or enter a URL" />
        <kbd class="slash" aria-hidden="true">/</kbd>
        <button class="go" type="submit" aria-label="Go">
          <span>Go</span>
          <svg viewBox="0 0 24 24"><use href="#i-arrow" /></svg>
        </button>
      </form>

      <div id="recents" class="recents" hidden></div>

      <div class="tiles" id="tiles"></div>
    </section>

    <footer class="foot">
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p>⚡ The Charged Proxy · powered by Scramjet, Ultraviolet &amp; Wisp</p>
    </footer>
  </main>

  <!-- ============ BROWSER VIEW ============ -->
  <section id="browser" class="browser" hidden>
    <nav class="toolbar">
      <button class="icon-btn goat-btn" id="bHome" title="Home" aria-label="Home">
        <img src="/img/goat/2_happy_idle.png" alt="" draggable="false" />
      </button>
      <div class="nav-group">
        <button class="icon-btn" id="bBack" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><use href="#i-left" /></svg></button>
        <button class="icon-btn" id="bFwd" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><use href="#i-right" /></svg></button>
        <button class="icon-btn" id="bReload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><use href="#i-reload" /></svg></button>
      </div>
      <form id="addrForm" class="address" autocomplete="off">
        <svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bolt" /></svg>
        <input id="addrInput" type="text" spellcheck="false" aria-label="Address" />
      </form>
      <div class="nav-group">
        <button class="icon-btn" id="bFull" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><use href="#i-full" /></svg></button>
        <button class="icon-btn" id="bPop" title="Open in new tab" aria-label="Open in new tab"><svg viewBox="0 0 24 24"><use href="#i-pop" /></svg></button>
        <button class="icon-btn" id="bClose" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-x" /></svg></button>
      </div>
      <div id="loadbar" class="loadbar"></div>
    </nav>
    <div class="frame-wrap" id="frameWrap">
      <iframe id="frame" title="Proxied page" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
    </div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <dialog id="settings" class="settings">
    <form method="dialog">
      <h2><svg viewBox="0 0 24 24"><use href="#i-gear" /></svg> Settings</h2>

      <label class="field">
        <span>Search engine</span>
        <select id="engineSelect">
          <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
          <option value="https://www.google.com/search?q=%s">Google</option>
          <option value="https://www.bing.com/search?q=%s">Bing</option>
          <option value="https://search.brave.com/search?q=%s">Brave Search</option>
        </select>
      </label>

      <label class="field">
        <span>Proxy engine</span>
        <select id="engineKindSelect">
          <option value="scramjet">Scramjet</option>
          <option value="uv">Ultraviolet</option>
        </select>
      </label>

      <label class="field">
        <span>Transport</span>
        <select id="transportSelect">
          <option value="libcurl">libcurl</option>
          <option value="epoxy">Epoxy</option>
        </select>
      </label>

      <p class="hint">If a site won't load, try switching the engine or transport.</p>

      <label class="field toggle">
        <span>Show sparks animation</span>
        <input type="checkbox" id="sparksToggle" />
      </label>

      <div class="field">
        <span>Recent sites</span>
        <button type="button" id="clearRecents" class="ghost">Clear recents</button>
      </div>

      <button class="primary" value="close">Done</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="alert" hidden></div>

  <!-- ============ ICONS ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-charge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22d3ee" />
        <stop offset=".5" stop-color="#4f5bff" />
        <stop offset="1" stop-color="#b13cf0" />
      </linearGradient>
    </defs>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.2 2 4 13.6h6.6L9.8 22 20 9.8h-6.7L13.2 2Z" /></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" /></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6" /></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6" /></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></symbol>
    <symbol id="i-pop" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18" /></symbol>
  </svg>

  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
