<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Short circuit · The Charged Proxy</title>
  <link rel="icon" type="image/svg+xml" href="/img/bolt.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .lost { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
    .lost .code { font-family: var(--pixel); font-size: clamp(64px, 16vw, 140px); line-height: 1; margin: 6px 0 0;
      background: var(--charge); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lost h1 { margin: 10px 0 6px; font-size: 26px; }
    .lost p { margin: 0 0 26px; color: var(--muted); }
    .lost a { display: inline-flex; align-items: center; height: 46px; padding: 0 24px; border-radius: 999px; color: #fff;
      text-decoration: none; font-weight: 600; background: var(--charge); box-shadow: 0 8px 26px -8px rgba(79, 91, 255, 0.9); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="grid"></div>
  </div>
  <main class="lost">
    <div>
      <div class="mascot"><div class="halo"></div><img src="/img/goat/3_shocked_idle.png" alt="Shocked goat" width="160" height="145" /></div>
      <p class="code">404</p>
      <h1>Short circuit</h1>
      <p>That page lost its charge. Head back and plug in somewhere else.</p>
      <a href="/">⚡ Back to the Charged Proxy</a>
    </div>
  </main>
</body>
</html>
